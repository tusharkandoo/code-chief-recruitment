<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | CodeChef Campus Club</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body data-page="admin">
<section class="login-view" id="login-view" hidden>
<form class="login-card" id="login-form" novalidate>
<a class="brand" href="index.html"><strong>CODECHEF</strong><span>CAMPUS CLUB</span></a>
<h1>Admin login</h1>
<p class="muted small">Demo login for this project: admin / codechef123. It runs in the browser only and is not secure authentication.</p>
<div class="field"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username"></div>
<div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password"></div>
<p class="form-alert" id="login-error" role="alert"></p>
<button class="btn btn-primary" type="submit">Log in</button>
<a class="small muted" href="index.html">Back to website</a>
</form>
</section>

<div class="admin-shell" id="app-view" hidden>
<aside class="sidebar" id="sidebar" aria-label="Admin navigation">
<a class="brand" href="index.html"><strong>CODECHEF</strong><span>ADMIN</span></a>
<nav class="side-nav">
<button class="side-link" type="button" data-view="dashboard">Dashboard</button>
<button class="side-link" type="button" data-view="events">Events</button>
<button class="side-link" type="button" data-view="registrations">Registrations</button>
</nav>
<button class="side-link side-logout" type="button" id="logout">Logout</button>
</aside>
<div class="admin-main">
<header class="admin-top">
<button class="btn btn-ghost btn-sm menu-btn" type="button" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
<h1 id="view-title">Dashboard</h1>
<a class="btn btn-ghost btn-sm" href="events.html">View site</a>
</header>
<main id="admin-content"></main>
</div>
</div>
</body>
</html>
